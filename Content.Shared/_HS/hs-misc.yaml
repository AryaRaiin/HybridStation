file: Resources/Prototypes/Entities/Objects/Misc/machine_parts.yml
- match:
    - id: BaseStockPart
  action: merge
  data:
    components:
    - type: GuideHelp
      guides:
      - MachineUpgrading
- match:
    - id: MicroManipulatorStockPart
  action: merge
  data:
    components:
    - type: MachinePart # Frontier
      part: Manipulator # Frontier
      rating: 1 # Frontier
#add to base, no match
- action: merge
  data:
  - type: entity
    id: CapacitorStockPart
    name: capacitor
    parent: BaseStockPart
    description: A basic capacitor used in the construction of a variety of devices.
    suffix: Rating 1
    components:
      - type: Sprite
        state: capacitor
      - type: Tag
        tags:
          - CapacitorStockPart
      - type: MachinePart # Frontier
        part: Capacitor # Frontier
        rating: 1 # Frontier
      - type: Stack
        stackType: Capacitor
  - type: entity
    id: MatterBinStockPart
    name: matter bin
    parent: BaseStockPart
    description: A basic matter bin used in the construction of a variety of devices.
    suffix: Rating 1
    components:
      - type: Sprite
        state: matter_bin
      - type: MachinePart # Frontier
        part: MatterBin # Frontier
        rating: 1 # Frontier
      - type: Stack
        stackType: MatterBin



