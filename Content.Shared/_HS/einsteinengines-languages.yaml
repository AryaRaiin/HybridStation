--- ### BASE ###
file: Resources/Prototypes/Entities/Mobs/base.yml
- match:
    - id: BaseMob
  action: merge
  data:
    components:
    - type: LanguageSpeaker # Einstein Engines - Language. This component is required to support speech, but it does not define known languages.

