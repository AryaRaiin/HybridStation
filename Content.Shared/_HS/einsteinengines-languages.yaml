--- ### SPACE ###
file: Resources/Prototypes/Entities/Objects/Fun/pai.yml
- match:
    - id: PersonalAI
  action: merge
  data:
    components:
    - type: LanguageKnowledge
        speaks: &speakable-languages
        - TauCetiBasic # Add individual languages so they can speak in said language for privacy.
        - Canilunzt
        - Bubblish
        - Nekomimetic
        - Draconic
        - SolCommon
        - RootSpeak
        - Moffic
        - ValyrianStandard
        - Chittin
        - SiikMaas
        - RobotTalk
        - DroneTalk
        - Marish
        - Freespeak
        - Tradeband
        understands:
        <<: *speakable-languages
        - Sign # Should know it but not speak it, for obvious reasons.

