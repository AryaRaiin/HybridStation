--- ### SOUP
file: Resources/Prototypes/Entities/Objects/Consumable/Food/soup.yml
template: templ-flavorol-soup.yaml
- match:
  - id: ${ID}
    components:
    - type: SolutionContainerManager
      solutions:
        food:
          reagents:
          - ReagentId: Flavorol !Missing
  action: merge
  data:
    components:
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: +${FLAV} !Math
          reagents:
          - ReagentId: Flavorol
            Quantity: ${FLAV}
---
file: Resources/Prototypes/Entities/Objects/Consumable/Food/soup.yml
- match:
  - id: FoodPlainGrits
  action: mergeadd
  data:
    type: entity
    name: buttered grits
    parent: FoodBowlBase
    id: FoodPlainGrits
    description: A savory bowl of grits, topped with a pat of butter.
    components:
    - type: FlavorProfile
      flavors:
      - savory
      - corn
      - butter
    - type: Sprite
      layers:
      - state: bowl
      - state: grits-butter
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 25
          reagents:
          - ReagentId: Butter
            Quantity: 5
          - ReagentId: Nutriment
            Quantity: 5
          - ReagentId: Vitamin
            Quantity: 5
          - ReagentId: Flavorol
            Quantity: 10
- match:
  - id: FoodCheeseGrits
  action: mergeadd
  data:
    type: entity
    name: cheese grits
    parent: FoodBowlBase
    id: FoodCheeseGrits
    description: A thick, savory bowl of cheesy grits.
    components:
    - type: FlavorProfile
      flavors:
      - savory
      - corn
      - cheesy
    - type: Sprite
      layers:
      - state: bowl
      - state: grits-cheese
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 30
          reagents:
          - ReagentId: Butter
            Quantity: 5
          - ReagentId: Nutriment
            Quantity: 10
          - ReagentId: Vitamin
            Quantity: 5
          - ReagentId: Flavorol
            Quantity: 10

