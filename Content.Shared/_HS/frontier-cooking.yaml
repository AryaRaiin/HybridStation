---
file: Resources/Prototypes/Recipes/Cooking/meal_recipes.yml

# came up with list by doing yq. explanation: look for all objects with recipeType either equal to or has an array object containing "Oven", print the id
#   cat $file | yq -r '.[] | select( .recipeType | if type!="array" then contains("Oven") else contains(["Oven"]) end ) | .id'


- match:
    - id: RecipePlainGrits
  action: mergeadd
  data:
    recipeType:
      type: microwaveMealRecipe
      name: butter grits recipe
      result: FoodPlainGrits
      time: 10
      group: Savory
      reagents:
        Cornmeal: 5
        Water: 10
      solids:
        FoodButterSlice: 1
        FoodBowlBig: 1

- match:
    - id: RecipeCheeseGrits
  action: mergeadd
  data:
      type: microwaveMealRecipe
      name: cheese grits recipe
      result: FoodCheeseGrits
      time: 10
      group: Savory
      reagents:
        Cornmeal: 5
        Water: 10
      solids:
        FoodCheeseSlice: 1
        FoodButterSlice: 1
        FoodBowlBig: 1


