# This is part of HS's port of Goobstation mechs to the PartAssembly system
- type: constructionGraph
  id: RipleyMKIIHarnessAssembly
  start: start
  graph:
  - node: start
    edges:
    - to: assembled
      steps:
      - assemblyId: RipleyMKII
        guideString: mech-construction-guide-string
  - node: assembled
    actions:
    - !type:DeleteEntitiesInContainer
      container: mech-assembly-container
    - !type:SpawnPrototype
      prototype: RipleyMKIIChassis
    - !type:DeleteEntity

