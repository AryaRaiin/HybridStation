# HS: magazine compatability at this location to avoid upstream edits, they are all from Monolith.
- type: entity
  id: Magazine635x40mmCaseless
  name: "magazine (6.35x40mm Caseless)"
  parent: BaseMagazine635x40mmCaseless
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge635x40mmCaseless
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  id: Magazine635x40mmCaselessShort
  name: "short magazine (6.35x40mm Caseless)"
  parent: BaseMagazine635x40mmCaselessShort
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge635x40mmCaseless
    capacity: 20
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  id: Magazine635x40mmCaselessPistol
  name: "pistol magazine (6.35x40mm Caseless)"
  parent: BaseMagazine635x40mmCaselessPistol
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge635x40mmCaseless
    capacity: 10
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance

- type: entity
  id: BaseMagazine635x40mmCaseless
  name: "magazine (6.35x40mm Caseless)"
  parent: [ BaseCartridge, RecyclableItemSteelTiny ]
  abstract: true
  components:
  - type: Tag
    tags:
    - Magazine635x40mmCaseless
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - Cartridge635x40mmCaseless
    proto: Cartridge635x40mmCaseless
    capacity: 30
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Magazine/6.35x40mm_caseless/6.35x40mm_caseless_rifle_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  id: BaseMagazine635x40mmCaselessShort
