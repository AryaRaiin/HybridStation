# This is part of HS's port of Monolith mechs to the PartAssembly system
- type: constructionGraph
  id: BroadswordHarnessAssembly
  start: start
  graph:
  - node: start
    edges:
    - to: assembled
      steps:
      - assemblyId: Broadsword
        guideString: mech-construction-guide-string
  - node: assembled
    actions:
    - !type:DeleteEntitiesInContainer
      container: mech-assembly-container
    - !type:SpawnPrototype
      prototype: BroadswordChassis
    - !type:DeleteEntity

